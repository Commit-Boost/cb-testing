# cb-testnet-verifier preset: PBS + Metrics
#
# Same as basic-pbs but with CB metrics enabled and Prometheus in the enclave.
# Adds [metrics] block to the CB config via commit_boost_config inline TOML.
#
# NOTE: Tier 2 metric checks will still SKIP until the CB metrics env var
# issue is resolved (CB needs CB_METRICS_PORT env var to start the metrics
# server, which kurtosis doesn't set). See PLAN.md for details.
#
# Usage:
#   ./scripts/run-and-verify.sh --config configs/pbs-metrics.yml

participants:
  - el_type: geth
    cl_type: lighthouse
    count: 2

additional_services:
  - spamoor
  - dora
  - prometheus

mev_type: commit-boost

mev_params:
  mev_boost_image: commit-boost/pbs:kurtosis
  mev_relay_image: ethpandaops/mev-boost-relay:main
  mev_builder_cl_image: sigp/lighthouse:latest
  mev_builder_image: ethpandaops/reth-rbuilder:develop
  commit_boost_config: |
    chain = { genesis_time_secs = {{ .Timestamp }}, path = "{{ .Network }}" }

    [pbs]
    host = "0.0.0.0"
    port = {{ .Port }}
    timeout_get_header_ms = 950
    timeout_get_payload_ms = 4000
    late_in_slot_time_ms = 2000

    {{ range $index, $relay := .Relays }}
    [[relays]]
    id = "mev_relay_{{$index}}"
    url = "{{ $relay }}"
    {{- end }}

    [metrics]
    host = "0.0.0.0"
    port = 9090

    [logs.stdout]
    level = "debug"

    [logs.file]
    enabled = false

network_params:
  network: kurtosis
  seconds_per_slot: 12
  num_validator_keys_per_node: 128
  preregistered_validator_keys_mnemonic:
    "giant issue aisle success illegal bike spike
    question tent bar rely arctic volcano long crawl hungry vocal artwork sniff fantasy
    very lucky have athlete"
