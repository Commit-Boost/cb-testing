# ePBS (gloas) devnet against a MAINNET-preset PRYSM build, for --assert block-submission.
# Identical to gloas-epbs-prysm.yaml except: mainnet preset + the mainnet-preset prysm
# images. block-submission verifies CB SSZ-decoding the revealed gloas SignedBeaconBlock
# at POST /eth/v1/builder/beacon_blocks; CB is compiled MainnetEthSpec, so the block it
# decodes must be mainnet-preset too (a minimal block over-reads its decoder and 400s).
#
# No local build here: prysm's gloas VC builder API (PR #17397) is merged to
# develop and released in v7.2.0, so a published mainnet-preset image carries it.
# The tags below are the <tag>-<sha> immutable variants (the bare
# glamsterdam-devnet-8 tag is rebuilt in place); ethpandaops' plain tag is the
# mainnet-preset build, its -minimal-<sha> sibling is the minimal-preset one.
participants:
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_type: prysm
    cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-8-aa30d6d
    vc_image: ethpandaops/prysm-validator:glamsterdam-devnet-8-aa30d6d
    cl_log_level: debug
    vc_log_level: debug
    # No vc_extra_params: upstream input_parser.star already appends
    # --enable-builder to a prysm VC under mev_type: buildoor
    # (apply_external_builder_flags), so repeating it here duplicates the flag.
    # PeerDAS/Fulu requires a supernode (or a node with 128+ validators).
    supernode: true
    keymanager_enabled: true
    validator_count: 64
mev_type: buildoor
buildoor_params:
  image: ethpandaops/buildoor@sha256:501764a3c43e6289fa1b85df9e7489f1d2de24e1efe0a65c4d316bd340166991
  builder_api: true
  epbs_builder: true
  lifecycle: true
  extra_args:
    - --log-level=debug
network_params:
  preset: mainnet
  seconds_per_slot: 6
  gloas_fork_epoch: 0
  attestation_due_bps_gloas: 2500
  withdrawal_type: "0x01"
  validator_balance: 32
  builder_count: 1
  builder_balance: 100
  deploy_eip8282_contracts: true
global_log_level: info
