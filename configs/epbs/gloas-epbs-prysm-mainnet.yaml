# ePBS (gloas) devnet against a MAINNET-preset PRYSM build, for --assert block-submission.
# Identical to gloas-epbs-prysm.yaml except: mainnet preset + the mainnet-preset prysm
# images. block-submission verifies CB SSZ-decoding the revealed gloas SignedBeaconBlock
# at POST /eth/v1/builder/beacon_blocks; CB is compiled MainnetEthSpec, so the block it
# decodes must be mainnet-preset too (a minimal block over-reads its decoder and 400s).
# Build the mainnet images WITHOUT --config=minimal (preset is compile-time in prysm):
#   bazelisk build //cmd/beacon-chain:oci_image_tarball //cmd/validator:oci_image_tarball \
#     --platforms=@io_bazel_rules_go//go/toolchain:linux_amd64_cgo --config=release
#   docker load -i bazel-bin/cmd/{beacon-chain,validator}/oci_image_tarball/tarball.tar
#   docker tag gcr.io/offchainlabs/prysm/beacon-chain:latest local/prysm-beacon-chain:epbs-mainnet
#   docker tag gcr.io/offchainlabs/prysm/validator:latest    local/prysm-validator:epbs-mainnet
participants:
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8
    cl_type: prysm
    cl_image: local/prysm-beacon-chain:epbs-mainnet
    vc_image: local/prysm-validator:epbs-mainnet
    cl_log_level: debug
    vc_log_level: debug
    vc_extra_params:
      - --enable-builder
    # PeerDAS/Fulu requires a supernode (or a node with 128+ validators).
    supernode: true
    keymanager_enabled: true
    validator_count: 64
mev_type: buildoor
buildoor_params:
  image: ethpandaops/buildoor@sha256:501764a3c43e6289fa1b85df9e7489f1d2de24e1efe0a65c4d316bd340166991
  builder_api: true
  epbs_builder: true
  lifecycle: true
  extra_args:
    - --log-level=debug
network_params:
  preset: mainnet
  seconds_per_slot: 6
  gloas_fork_epoch: 0
  attestation_due_bps_gloas: 2500
  withdrawal_type: "0x01"
  validator_balance: 32
  builder_count: 1
  builder_balance: 100
  deploy_eip8282_contracts: true
global_log_level: info
