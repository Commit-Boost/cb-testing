# ePBS (gloas) devnet, TWO consensus clients.
#
# WHY this variant exists: the single-lodestar gloas-epbs.yaml cannot FINALIZE on
# the mainnet preset because the gloas lodestar image of the time packed only ~1
# attestation aggregate per block; on mainnet's 32-slot epochs that leaves the
# chain short of the 2/3 justification threshold, so it never finalizes, so
# buildoor's builder deposit (activation needs a FINALIZED eligibility epoch)
# never activates. That once kept --assert block-submission off builder-built
# slots, while CB decoded the block and so needed the mainnet preset; CB now
# forwards it unparsed, so the mode runs on minimal, and this file stays as the
# mainnet-preset, cross-client harness.
#
# This config adds a second participant (lighthouse) to CARRY FINALIZATION: it
# attests, and its proposer slots pack full aggregates, so the chain justifies and
# finalizes. buildoor bids through lodestar's slots via CB; lighthouse's own
# proposer slots build locally, because the image pinned below predates the gloas
# builder API landing in lighthouse (sigp/lighthouse#9807 for the VC flow and
# #9864 for the keymanager builder_config endpoint, both merged to unstable).
# An unstable image makes this a second CB-in-loop client rather than a carrier.
#
# Multi-CL coverage is also a standing ePBS regression goal, so this doubles as
# the first cross-client harness.
#
# lodestar MUST stay participant #1: scripts/run-epbs-sim.sh discovers the BN and
# keymanager VC by the fixed service names cl-1-lodestar-geth / vc-1-geth-lodestar.
#
# Run: ARGS_FILE=configs/epbs/gloas-epbs-2cl.yaml PRESET=mainnet \
#      OBSERVE_SLOTS=40 MIN_BUILDER_SLOTS=6 bash scripts/run-epbs-sim.sh
participants:
  # --- participant #1: lodestar, the CB / buildoor path (keymanager builder_config) ---
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_type: lodestar
    # nflaig/builder-api-2: gloas builder api + keymanager builder_config support
    cl_image: chainsafe/lodestar:v1.50.0
    vc_image: chainsafe/lodestar:v1.50.0
    cl_log_level: debug
    vc_log_level: debug
    vc_extra_params:
      - --graffiti=builder-dev
    supernode: true
    keymanager_enabled: true
    validator_count: 64
  # --- participant #2: lighthouse, the finalization carrier (no builder API) ---
  # lighthouse blocks build locally and never reach CB, so the image only needs to
  # attest and pack full aggregates on this devnet; the clean devnet-8 tag does.
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8-fa18cdb
    vc_image: ethpandaops/lighthouse:glamsterdam-devnet-8-fa18cdb
    cl_log_level: debug
    vc_extra_params:
      - --graffiti=finalizer
    supernode: true
    keymanager_enabled: false
    validator_count: 64
mev_type: buildoor
buildoor_params:
  # pinned digest = main-cca24f1: buildoor #192, which accepts the builder-specs #168 hostname auth data
  image: ethpandaops/buildoor@sha256:b3dc726f8ba5ce944733f6e2b4bb5f8cb3885f98bacdc2a3e0bf3669f4b58064
  builder_api: true
  epbs_builder: true
  lifecycle: true
  extra_args:
    - --log-level=debug
network_params:
  preset: minimal
  # NO seconds_per_slot override on the mainnet preset. The gloas devnet renamed
  # SECONDS_PER_SLOT -> SLOT_DURATION_MS: a custom 6s applies to the chain (the CLs
  # honor SLOT_DURATION_MS=6000) but the CLs still serve the LEGACY SECONDS_PER_SLOT
  # at the mainnet default 12 in /config/spec, and buildoor derives its slot clock
  # from that legacy field. Result: chain at 6s, buildoor at 12s, buildoor rejects
  # every bid as "slot too far ahead" and never builds. Leaving it native (12s
  # everywhere) keeps chain + spec + buildoor consistent. Minimal-preset runs
  # (gloas-epbs.yaml) can keep seconds_per_slot: 6 because minimal's legacy default
  # is already 6, so there is no skew there.
  gloas_fork_epoch: 0
  attestation_due_bps_gloas: 2500
  withdrawal_type: "0x01"
  validator_balance: 32
  builder_count: 1
  builder_balance: 100
  deploy_eip8282_contracts: true
