# ePBS (gloas) devnet against a PRYSM CL/VC build (VC -> gloas builder API).
# Same loop as gloas-epbs.yaml (VC -> keymanager builder_config -> commit-boost ->
# buildoor) but with prysm instead of lodestar. Prysm exposes the same keymanager
# POST /eth/v1/validator/{pubkey}/builder_config endpoint (validator/rpc
# handlers_validator_config.go SetBuilderConfig), so `cb-km apply` reuses unchanged.
# Prysm uses SEPARATE beacon-chain + validator images.
#
# MINIMAL preset. Prysm's preset is COMPILE-TIME, so a mainnet-preset binary cannot
# load a minimal genesis and the image must be a minimal build. ethpandaops
# publishes one, so no local build is needed: the -minimal- tags below are the
# minimal-compiled siblings of the plain devnet-8 tags used by the mainnet config.
# Build aa30d6d is 23 commits past the merge of the VC gloas builder API
# (OffchainLabs/prysm#17397).
participants:
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_type: prysm
    cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-8-minimal-aa30d6d
    vc_image: ethpandaops/prysm-validator:glamsterdam-devnet-8-minimal-aa30d6d
    cl_log_level: debug
    vc_log_level: debug
    # No vc_extra_params: upstream input_parser.star already appends
    # --enable-builder to a prysm VC under mev_type: buildoor
    # (apply_external_builder_flags), so repeating it here duplicates the flag.
    # PeerDAS/Fulu requires a supernode (or a node with 128+ validators).
    supernode: true
    keymanager_enabled: true
    validator_count: 64
mev_type: buildoor
buildoor_params:
  image: ethpandaops/buildoor@sha256:501764a3c43e6289fa1b85df9e7489f1d2de24e1efe0a65c4d316bd340166991
  builder_api: true
  epbs_builder: true
  lifecycle: true
  extra_args:
    - --log-level=debug
network_params:
  preset: minimal
  seconds_per_slot: 6
  gloas_fork_epoch: 0
  attestation_due_bps_gloas: 2500
  withdrawal_type: "0x01"
  validator_balance: 32
  builder_count: 1
  builder_balance: 100
  deploy_eip8282_contracts: true
global_log_level: info
