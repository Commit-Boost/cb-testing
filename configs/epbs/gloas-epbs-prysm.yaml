# ePBS (gloas) devnet against a PRYSM CL/VC build (PR #17397, VC -> gloas builder API).
# Same loop as gloas-epbs.yaml (VC -> keymanager builder_config -> commit-boost ->
# buildoor) but with prysm instead of lodestar. Prysm exposes the same keymanager
# POST /eth/v1/validator/{pubkey}/builder_config endpoint (validator/rpc
# handlers_validator_config.go SetBuilderConfig), so `cb-km apply` reuses unchanged.
# Prysm uses SEPARATE beacon-chain + validator images and needs --enable-builder on
# the VC. Build from the PR branch with BOTH --config=release AND --config=minimal
# (prysm's preset is COMPILE-TIME; a mainnet-built binary can't load a minimal genesis):
#   git clone --branch builder-rest-vc https://github.com/OffchainLabs/prysm
#   bazelisk build //cmd/beacon-chain:oci_image_tarball //cmd/validator:oci_image_tarball \
#     --platforms=@io_bazel_rules_go//go/toolchain:linux_amd64_cgo --config=release --config=minimal
#   docker load -i bazel-bin/cmd/{beacon-chain,validator}/oci_image_tarball/tarball.tar
# Then RE-TAG to a local-only name (the sim runs --image-download always, which would
# otherwise pull the PUBLIC gcr.io/offchainlabs/prysm over your local build):
#   docker tag gcr.io/offchainlabs/prysm/beacon-chain:latest local/prysm-beacon-chain:epbs
#   docker tag gcr.io/offchainlabs/prysm/validator:latest    local/prysm-validator:epbs
participants:
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8
    cl_type: prysm
    cl_image: local/prysm-beacon-chain:epbs
    vc_image: local/prysm-validator:epbs
    cl_log_level: debug
    vc_log_level: debug
    vc_extra_params:
      - --enable-builder
    # PeerDAS/Fulu requires a supernode (or a node with 128+ validators).
    supernode: true
    keymanager_enabled: true
    validator_count: 64
mev_type: buildoor
buildoor_params:
  image: ethpandaops/buildoor@sha256:501764a3c43e6289fa1b85df9e7489f1d2de24e1efe0a65c4d316bd340166991
  builder_api: true
  epbs_builder: true
  lifecycle: true
  extra_args:
    - --log-level=debug
network_params:
  preset: minimal
  seconds_per_slot: 6
  gloas_fork_epoch: 0
  attestation_due_bps_gloas: 2500
  withdrawal_type: "0x01"
  validator_balance: 32
  builder_count: 1
  builder_balance: 100
  deploy_eip8282_contracts: true
global_log_level: info
