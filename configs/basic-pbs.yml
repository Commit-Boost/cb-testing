# cb-testnet-verifier preset: Basic PBS Pipeline
#
# Tests the core MEV pipeline through Commit-Boost.
#
# Image pinning rationale (from the CB repo's working kurtosis config):
#   - mev_boost_image = commit-boost/pbs:kurtosis
#       CB-internal kurtosis build. Must be built locally from the
#       commit-boost-client repo (e.g. `just kurtosis-image` or equivalent)
#       before running. The ghcr :latest tag has historically been unstable.
#   - mev_relay_image and mev_builder_image pinned to the pair known to
#       co-operate. Rolling tags drift; this pair is what the CB repo runs.
#
# Usage:
#   ./scripts/run-and-verify.sh --config configs/basic-pbs.yml

participants:
  - el_type: geth
    cl_type: lighthouse

additional_services:
  - dora
  - spamoor
mev_type: commit-boost

mev_params:
  mev_relay_image: ethpandaops/mev-boost-relay:main
  mev_boost_image: commit-boost/pbs:kurtosis
  mev_builder_cl_image: sigp/lighthouse:latest
  mev_builder_image: ethpandaops/reth-rbuilder:develop

