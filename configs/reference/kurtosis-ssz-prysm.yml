# Kurtosis config: SSZ get_header testing with Prysm
# Prysm is the ONLY major CL that requires a flag for SSZ builder API support.
# Without --enable-builder-ssz, Prysm sends Accept: application/json only.
#
# Prerequisites:
#   just build-pbs kurtosis
#
# Run:
#   kurtosis run github.com/ethpandaops/ethereum-package \
#     --enclave CB-Testnet \
#     --args-file provisioning/kurtosis-ssz-prysm.yml
#
# Verify SSZ is flowing:
#   kurtosis service logs CB-Testnet commit-boost-001-prysm-geth 2>&1 | grep -i "content_type\|ssz\|encoding"

participants:
  - el_type: geth
    cl_type: prysm
    cl_extra_params:
      - "--enable-builder-ssz"
    count: 2

additional_services:
  - dora

mev_type: commit-boost

mev_params:
  mev_boost_image: commit-boost/pbs:kurtosis
  mev_relay_image: ethpandaops/mev-boost-relay:main
  mev_builder_cl_image: sigp/lighthouse:latest
  mev_builder_image: ethpandaops/reth-rbuilder:develop
