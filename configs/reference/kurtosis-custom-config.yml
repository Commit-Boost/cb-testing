# Test config: exercises commit_boost_config inline override.
# Adds skip_sigverify and custom timeouts that the default template doesn't expose.
#
# Run against local ethereum-package with the feature branch:
#   just kurtosis-restart /path/to/ethereum-package provisioning/kurtosis-custom-config.yml

participants:
  - el_type: geth
    cl_type: lighthouse
    count: 2

additional_services:
  - dora

mev_type: commit-boost

mev_params:
  mev_boost_image: commit-boost/pbs:kurtosis
  mev_relay_image: ethpandaops/mev-boost-relay:main
  mev_builder_cl_image: sigp/lighthouse:latest
  mev_builder_image: ethpandaops/reth-rbuilder:develop
  commit_boost_config: |
    chain = { genesis_time_secs = {{ .Timestamp }}, path = "{{ .Network }}" }

    [pbs]
    host = "0.0.0.0"
    port = {{ .Port }}
    skip_sigverify = true
    timeout_get_header_ms = 800
    timeout_get_payload_ms = 3000
    late_in_slot_time_ms = 1500

    {{ range $index, $relay := .Relays }}
    [[relays]]
    id = "mev_relay_{{$index}}"
    url = "{{ $relay }}"
    {{- end }}

    [logs.stdout]
    level = "debug"

    [logs.file]
    enabled = false
