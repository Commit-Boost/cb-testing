[project]
name = "cb-testnet-verifier"
version = "0.1.0"
description = "Automated verification for Commit-Boost Kurtosis testnets"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
cb-verify = "cb_verifier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
