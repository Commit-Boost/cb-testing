[package]
name = "cb-testnet-verifier"
default-run = "cb-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Automated verification for Commit-Boost Kurtosis testnets"
license = "MIT"

[[bin]]
name = "cb-verify"
path = "src/main.rs"

[[bin]]
name = "cb-orchestrator"
path = "src/orchestrator.rs"

[[bin]]
name = "test-mux"
path = "src/bin/test_mux.rs"


[dependencies]
alloy-primitives = "^1.3.1"
alloy-rpc-types-beacon = "^1.0.35"
clap = { version = "4.5", features = ["derive"] }
colored = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eyre = "0.6"
color-eyre = "0.6"
prometheus-parse = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9.34"

[profile.release]
strip = true
lto = true
